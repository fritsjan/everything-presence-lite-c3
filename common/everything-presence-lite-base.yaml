esphome:
  name: ${name}
  comment: Everything Presence Lite
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True
  project: 
    name: EverythingSmartTechnology.Everything Presence Lite
    version: "1.4.2.beta"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (std::string("${ device_config.bluetooth_enabled | lower }") == "true") {
            id(firmware_ble).publish_state("Enabled");
          } else {
            id(firmware_ble).publish_state("Disabled");
          }

          if (std::string("${ device_config.co2_enabled | lower }") == "true") {
            id(firmware_co2).publish_state("Enabled");
          } else {
            id(firmware_co2).publish_state("Disabled");
          }
      # turn on neopixel 1
      - light.turn_on:
          id: neopixel_1
          brightness: 50%
          red: 50%
          green: 50%
          blue: 0%
      - script.execute: illuminance_measurement_loop

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# Enable logging (use USB_SERIAL_JTAG so UART0 on GPIO20/21 is free for LD2450)
logger:
  level: ${log_level}
  hardware_uart: USB_SERIAL_JTAG

# Enable Home Assistant API
api:
  actions:
    - action: set_update_manifest
      variables:
        url: string
      then:
        - lambda: |-
            ESP_LOGI("fw", "Setting update manifest URL: %s", url.c_str());
            id(update_http_request).set_source_url(url);
        - component.update: update_http_request
        - delay: 1s
        - update.perform:
            id: update_http_request
            force_update: true
    - action: get_build_flags
      then:
        - api.respond:
            data: !lambda |-
              root["ethernet_enabled"]  = ${ device_config.ethernet_enabled | lower };
              root["co2_enabled"]       = ${ device_config.co2_enabled | lower };
              root["bluetooth_enabled"] = ${ device_config.bluetooth_enabled | lower };
              root["board_revision"]    = "${ device_config.board_revision }";
              root["sensor_variant"]    = "${ device_config.sensor_variant }";
              root["firmware_channel"]  = "${ device_config.firmware_channel }";
              root["model"]             = "${ device_config.model }";

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request

http_request:

wifi:
  #on connect neopixel 1 green, on disconnect neopixel 1 red
  on_connect:
    then:
      - light.turn_on:
          id: neopixel_1
          brightness: 50%
          red: 0%
          green: 50%
          blue: 0%
  on_disconnect:
    then:
      - light.turn_on:
          id: neopixel_1
          brightness: 50%
          red: 50%
          green: 0%
          blue: 0%


improv_serial:

i2c:
-  id: bus_a
   sda: 0
   scl: 1
   scan: true

globals:
  - id: neopixel_1_was_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: neopixel_2_was_on
    type: bool
    restore_value: false
    initial_value: "false"
  - id: neopixel_3_was_on
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: measure_lux
    then:
      # Sla de huidige aan/uit-staat op van elke NeoPixel
      - lambda: |-
          id(neopixel_1_was_on) = id(neopixel_1).current_values.is_on();
          id(neopixel_2_was_on) = id(neopixel_2).current_values.is_on();
          id(neopixel_3_was_on) = id(neopixel_3).current_values.is_on();
      # - globals.set:
      #     id: neopixel_1_was_on
      #     value: !lambda return id(neopixel_1).current_values.is_on();
      # - lambda: |-
      #     ESP_LOGI("lux", "NeoPixel 1 was: %s", id(neopixel_1_was_on) ? "on" : "off");
      # - globals.set:
      #     id: neopixel_2_was_on
      #     value: !lambda return id(neopixel_2).current_values.is_on();
      # - lambda: |-
      #     ESP_LOGI("lux", "NeoPixel 2 was: %s", id(neopixel_2_was_on) ? "on" : "off");
      # - globals.set:
      #     id: neopixel_3_was_on
      #     value: !lambda return id(neopixel_3).current_values.is_on();
      # - lambda: |-
      #     ESP_LOGI("lux", "NeoPixel 3 was: %s", id(neopixel_3_was_on) ? "on" : "off");
      - delay: 50ms
      # Zet alle NeoPixels uit zodat ze de lichtmeting niet beïnvloeden
      - light.turn_off: neopixel_1
      - light.turn_off: neopixel_2
      - light.turn_off: neopixel_3
      # Wacht tot de LEDs zijn uitgedoofd
      - delay: 200ms
      # Start de BH1750 meting (herstel via on_raw_value callback)
      - component.update: illuminance_sensor

  - id: illuminance_measurement_loop
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - script.execute: measure_lux
            - script.wait: measure_lux
            - delay: !lambda "return (uint32_t)(id(illuminance_interval_ui).state * 1000);"

light:
  - platform: status_led
    name: ESP32 LED
    id: esp32_led
    pin: GPIO8
    internal: False
    restore_mode: ALWAYS_OFF
    entity_category: config

  - platform: esp32_rmt_led_strip
    id: rgb_strip
    pin: GPIO4
    num_leds: 3
    rgb_order: GRB
    chipset: SK6812
    name: "NeoPixel Strip"
    internal: true

  - platform: partition
    name: "NeoPixel 1"
    id: neopixel_1
    segments:
      - id: rgb_strip
        from: 0
        to: 0
    entity_category: config

  - platform: partition
    name: "NeoPixel 2"
    id: neopixel_2
    segments:
      - id: rgb_strip
        from: 1
        to: 1
    entity_category: config

  - platform: partition
    name: "NeoPixel 3"
    id: neopixel_3
    segments:
      - id: rgb_strip
        from: 2
        to: 2
    entity_category: config

number:
  - platform: template
    name: "Illuminance Offset"
    id: illuminance_offset_ui
    unit_of_measurement: "lx"
    min_value: -100
    max_value: 100
    step: 5
    mode: slider
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:brightness-5"
    entity_category: config
    on_value:
      - script.execute: measure_lux

  - platform: template
    name: "Illuminance Update Interval"
    id: illuminance_interval_ui
    unit_of_measurement: "s"
    min_value: 10
    max_value: 600
    step: 1
    mode: slider
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 60
    icon: "mdi:timer-outline"
    entity_category: config
    on_value:
      - script.execute: illuminance_measurement_loop

sensor:
  - platform: bh1750
    name: Illuminance
    id: illuminance_sensor
    i2c_id: bus_a
    address: 0x23
    update_interval: never
    accuracy_decimals: 0
    filters:
      - lambda: "return x + id(illuminance_offset_ui).state;"
      - or:
        - delta: 5%
        - delta: 5
      - clamp:
          min_value: 0
    on_raw_value:
      then:
        # Herstel de staat van elke NeoPixel na de meting
        - if:
            condition:
              lambda: 'return id(neopixel_1_was_on);'
            then:
              - light.turn_on: neopixel_1
        - if:
            condition:
              lambda: 'return id(neopixel_2_was_on);'
            then:
              - light.turn_on: neopixel_2
        - if:
            condition:
              lambda: 'return id(neopixel_3_was_on);'
            then:
              - light.turn_on: neopixel_3

binary_sensor:
  - platform: gpio
    pin:
      number: 9
      inverted: true
    id: flash_button
    internal: True
    filters:
      - delayed_on: 50ms 
    on_multi_click:
      - timing:
          - ON for 0.2s to 3s
          - OFF for 0.1s to 2s
          - ON for 0.2s to 3s
          - OFF for 0.1s to 2s
          - ON for at least 5s 
        then:
          - repeat: 
              count: 5
              then:
                - light.turn_on: esp32_led
                - delay: 150ms
                - light.turn_off: esp32_led
                - delay: 150ms
          - light.turn_on: esp32_led
          - button.press: factory_reset_button

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
    entity_category: config
  - platform: template
    name: "Apply Update"
    entity_category: diagnostic
    on_press:
      - logger.log: "Applying firmware update based on selected configuration"
      - lambda: |-
          std::string base_url = "https://everythingsmarthome.github.io/everything-presence-lite/everything-presence-lite-ha";
          std::string variant = "${device_config.sensor_variant}";
          if (variant == "ld2450") {
            variant.clear();
          }

          if (!variant.empty()) {
            base_url += "-";
            base_url += variant;
          }

          if (id(firmware_ble).current_option() == "Disabled") {
            base_url += "-no-ble";
          }

          if (id(firmware_co2).current_option() == "Enabled") {
            base_url += "-co2";
          }

          base_url += "-manifest.json";

          ESP_LOGI("firmware", "Switching to manifest: %s", base_url.c_str());
          id(update_http_request).set_source_url(base_url.c_str());
      - component.update: update_http_request
      - delay: 2s
      - update.perform:
          id: update_http_request
          force_update: true
  - platform: factory_reset
    id: "factory_reset_button"
    internal: True

select:
  - platform: template
    id: firmware_ble
    name: Bluetooth Proxy
    icon: "mdi:bluetooth"
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    options:
      - "Disabled"
      - "Enabled"
    initial_option: "Disabled"

  - platform: template
    id: firmware_co2
    name: CO2 Sensor
    icon: "mdi:molecule-co2"
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    options:
      - "Disabled"
      - "Enabled"
    initial_option: "Disabled"
